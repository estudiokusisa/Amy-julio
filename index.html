<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amy & Julio - Nuestra Boda</title>
    <link rel="stylesheet" href="style.css">
    <!-- Favicon personalizado -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- Metadatos para Miniatura en WhatsApp y Redes Sociales -->
    <meta property="og:title" content="¡Nuestra Boda! - Amy & Julio">
    <meta property="og:description" content="Hemos reservado un lugar muy especial para ti. ¡Haz clic para ver los detalles de nuestra invitación!">
    <meta property="og:image" content="https://amy-y-julio.netlify.app/assets/miniatura.jpg">
    <meta property="og:url" content="https://amy-y-julio.netlify.app/">
    <meta property="og:type" content="website">

    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fondo principal -->
    <div class="background-container" style="background-image: url('assets/fondo.png');">
        
        <div class="invitation-wrapper">
            
            <div class="invitation-stage">
                
                <!-- 1. CAPA INFERIOR: EL SOBRE -->
                <div class="sobre-wrapper" id="sobre">
                    <img src="assets/sobre.png" alt="Sobre" class="img-sobre">
                </div>

                <!-- 2. CAPA INTERMEDIA: LA CARTILLA (Cuadrado amarillo) -->
                <div class="cartilla-wrapper" id="cartilla">
                    <img src="assets/cartilla.png" alt="Cartilla" class="img-cartilla">
                    
                    <div class="cartilla-content">
                        <p class="sub-title">Con aprecio para:</p>
                        <h2 class="guest-name" id="nombre-invitado">Cargando...</h2>
                        
                        <p class="sub-title" style="margin-top: 10px;">Hemos reservado</p>
                        <h3 class="total-pases" id="total-pases">-- PASES</h3>
                        
                        <p class="passes-description" id="detalle-pases">Cargando detalles...</p>
                    </div>
                </div>

                <!-- 3. CAPA SUPERIOR: EL SELLO DE CERA (Círculo verde) -->
                <div class="sello-wrapper" id="sello">
                    <img src="assets/sello.png" alt="Sello de cera" class="img-sello">
                </div>

            </div>

            <!-- 4. BOTÓN "VER DETALLES" (Abre en la misma pestaña) -->
            <div class="btn-detalles-container" id="btn-detalles">
                <a href="https://kusisainvitaciones.com/amy-y-julio" class="btn-detalles">VER DETALLES</a>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
